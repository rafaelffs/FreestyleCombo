server {
    listen 80;
    server_name fscombo.com www.fscombo.com;
    return 301 https://www.fscombo.com$request_uri;
}

server {
    listen 443 ssl;
    server_name fscombo.com www.fscombo.com;

    ssl_certificate /etc/letsencrypt/live/fscombo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fscombo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/freestylecombo;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-rendered Open Graph preview + redirect for shared combo links
    # (ShareController, api/FreestyleCombo.API/Controllers/ShareController.cs)
    location /share/ {
        proxy_pass http://127.0.0.1:5050/share/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # iOS Universal Links manifest (web/public/.well-known/apple-app-site-association,
    # also mirrored at the site root for older-iOS compatibility) — must be served
    # as application/json, extensionless, no redirects.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }
    location = /apple-app-site-association {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
