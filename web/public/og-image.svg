<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B4FE9"/>
      <stop offset="55%" stop-color="#7A5AF0"/>
      <stop offset="100%" stop-color="#8E6BF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EEEAFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F9FF"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- App Icon (rounded rect + ATW mark) -->
  <rect x="90" y="180" width="270" height="270"
        rx="70.2"
        fill="url(#icon-bg)"
        filter="drop-shadow(0 6px 20px #5B4AD455)"/>

  <!-- ATW mark inside icon: orbit ring + ball + bolt + satellite -->
  <g transform="translate(90, 180) scale(2.7)">
    <ellipse cx="50" cy="50" rx="44" ry="19" transform="rotate(-28 50 50)"
             fill="none" stroke="#fff" stroke-width="6.5" opacity=".7"/>
    <circle cx="50" cy="50" r="28" fill="#fff"/>
    <path d="M59 13L26 56h19l-4 31 33-44H54z" fill="#6A54EE"
          transform="translate(50 50) scale(.56) translate(-50 -50)"/>
    <circle cx="88.85" cy="29.36" r="9" fill="#fff"/>
  </g>

  <!-- FREESTYLE -->
  <text x="412" y="262.6"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="600"
        fill="#4F46E5" letter-spacing="9.7"
        text-anchor="start">FREESTYLE</text>

  <!-- Combo -->
  <text x="408.0" y="386.8"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="138" font-weight="800"
        fill="#15131F" letter-spacing="-2"
        text-anchor="start">Combo</text>
</svg>